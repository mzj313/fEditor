[package]
name = "file-editor"
version = "1.1.1"
description = "Sublime 风格的轻量文本编辑器"
authors = ["mzj"]
edition = "2024"

[lib]
name = "file_editor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# 单实例：右键重复打开文件时转交给已运行实例，而不是再起一个进程
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 全文搜索的正则/大小写匹配；已在依赖树中，不会额外增加构建成本
regex = "1"
encoding_rs = "0.8"
chardetng = "0.1"
tempfile = "3"
portable-pty = "0.9.0"
flate2 = "1"
# 在线翻译回退用；Windows 上走系统 schannel，无额外证书依赖
reqwest = { version = "0.12", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
# 只用到 Interface 转换：把 WebView2 的 Settings 升到 Settings5 打开触控板捏合缩放
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKPDFConfiguration", "block2"] }

[profile.release]
# 为「每次改动都走 release」的迭代方式调优：
# thin LTO + 多 codegen-units 牺牲一点体积换回可接受的增量链接速度；
# 若要发布最小包，可临时改回 lto = true、codegen-units = 1
codegen-units = 4
lto = "thin"
opt-level = "z"
panic = "abort"
strip = true

[profile.dev]
debug = 1
